<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="mfgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Container -->
  <rect width="160" height="160" rx="36" fill="#040d0a" />
  <rect x="2" y="2" width="156" height="156" rx="34" fill="none" stroke="#10b981" stroke-opacity="0.22" stroke-width="2" />

  <!-- Industrial Manufacturing Extruder Gear & Inventory Storage Cube -->
  <g filter="url(#mfgGlow)">
    <!-- Industrial Hexagonal Manufacturing Enclosure -->
    <polygon points="80,28 120,50 120,98 80,120 40,98 40,50" fill="none" stroke="url(#nexusGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Central Factory Gear Teeth / Hub -->
    <circle cx="80" cy="74" r="18" fill="#040d0a" stroke="#10b981" stroke-width="3" />
    <circle cx="80" cy="74" r="6" fill="#10b981" />

    <!-- Station Tablet QR Pairing Beacons -->
    <line x1="80" y1="28" x2="80" y2="44" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="120" y1="98" x2="106" y2="90" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="98" x2="54" y2="90" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

    <circle cx="80" cy="44" r="2.5" fill="#38bdf8" />
    <circle cx="106" cy="90" r="2.5" fill="#38bdf8" />
    <circle cx="54" cy="90" r="2.5" fill="#38bdf8" />
  </g>
</svg>
