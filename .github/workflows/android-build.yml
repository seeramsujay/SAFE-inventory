name: Build Android Applications

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 'latest'

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build React Web App
        run: pnpm build

      - name: Sync React Build with Capacitor Android
        run: pnpm cap sync

      - name: Set up Gradle and Build Applications
        uses: gradle/actions/setup-gradle@v3

      - name: Build Capacitor Android App (APK)
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..

      - name: Build Native Android App (APK)
        run: |
          ./gradlew :app:assembleDebug

      - name: Upload Capacitor Android APK
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: native-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
